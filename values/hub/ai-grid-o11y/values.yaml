# Environment-specific configuration for the hub's ai-grid-o11y Application.
# These values are layered over the chart's defaults
# (charts/ai-grid-o11y/values.yaml) by the hub's ApplicationSet: uncomment and
# override only what differs in this environment. Entries left commented match
# the chart's defaults.
#
# Fork divergence (BYO ODF, formerly a patch on apps/ai-grid-o11y/manifests/
# lokistack.yaml): the dedicated hub has no gp3-csi (an AWS class); its
# ZTP-installed ODF provides ocs-storagecluster-ceph-rbd as the default
# (RHAI-20050).
lokiStack:
  storageClassName: ocs-storagecluster-ceph-rbd
#  size: 1x.demo
#  retentionDays: 30
#  # S3 endpoint used by the object-storage secret provisioned from the OBC credentials.
#  s3Endpoint: https://s3.openshift-storage.svc:443
