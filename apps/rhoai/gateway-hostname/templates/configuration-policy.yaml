{{- /* Fork divergence: an enable gate so the policy can be skipped where the
       MaaS Gateway does not exist. The template otherwise renders an enforce
       policy that tries to CREATE the Gateway from this partial spec (no
       port/protocol/gatewayClassName) on inference sites, where MaaS is
       removed - an invalid object and a permanent violation. Defaults to
       true so upstream behavior is unchanged when not configured. */ -}}
{{- /* "false" disables; anything else (unset, true) keeps upstream behavior.
       A plain `if .Values.enabled | default true` does not work: Helm's
       default replaces the boolean false, so it can never disable. */ -}}
{{- $enabled := .Values.enabled | toString -}}
{{- if ne $enabled "false" }}
{{- $gateway := .Values.components.aigateway.modelsAsAService.gateway }}
{{- $hostnamePrefix := index $gateway.annotations "ai-grid/maas-gateway-hostname-prefix" }}
{{- if not $hostnamePrefix }}{{ fail "components.aigateway.modelsAsAService.gateway.annotations.ai-grid/maas-gateway-hostname-prefix is required" }}{{ end }}
apiVersion: policy.open-cluster-management.io/v1
kind: ConfigurationPolicy
metadata:
  name: rhoai-maas-gateway-hostname
  namespace: {{ required "clusterNamespace is required" .Values.clusterNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  remediationAction: enforce
  severity: high
  object-templates:
    - complianceType: musthave
      objectDefinition:
        apiVersion: gateway.networking.k8s.io/v1
        kind: Gateway
        metadata:
          name: {{ $gateway.name }}
          namespace: {{ $gateway.namespace }}
        spec:
          listeners:
            - name: http
              hostname: '{{ $hostnamePrefix }}.{{ "{{" }} (lookup "config.openshift.io/v1" "Ingress" "" "cluster").spec.domain {{ "}}" }}'
            - name: https
              hostname: '{{ $hostnamePrefix }}.{{ "{{" }} (lookup "config.openshift.io/v1" "Ingress" "" "cluster").spec.domain {{ "}}" }}'
{{- end }}
