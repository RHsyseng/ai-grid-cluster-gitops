# Per-cluster overrides for cpu-0 (ai-grid/role=ingress). The rhoai
# ApplicationSet merges this after apps/rhoai/values.yaml and the role
# profile; absent for other clusters (ignoreMissingValueFiles).
#
# Currently a comment-only stub: cpu-0's MaaS Gateway uses the default
# LoadBalancer exposure (the openshiftRoute block below is DISABLED). Route
# mode is blocked at runtime by RHAI-21506 -- maas-api's /v1/tenants reads
# spec.listeners[].hostname, which a Route-mode listener cannot carry --
# and the chart (>= 3.6.0-dev.34.1, odh-gitops PR #285) fails the render
# when a hostname is set in Route mode. The rhoai-maas-gateway-hostname
# policy patches the listener hostnames to maas.<apps domain>; the lab has
# a DNS record for that name pointing at the Gateway's MetalLB address
# (the *.apps wildcard reaches only the router).
#
# A Gateway spec.addresses Hostname declaration (maas.<apps domain>) was
# tried in 945ee0d and removed: istiod copies spec.addresses into the
# LoadBalancer Service's spec.loadBalancerIP, and MetalLB allocates for
# that field only when it is an IP -- on a fresh install the Service is
# born with the hostname there and the controller logs
# "AllocationFailed: invalid spec.loadBalancerIP", leaving the Gateway
# Programmed=False forever. It only looked inert on 2026-11-13 because it
# landed after MetalLB had already assigned an address. It also never
# produced a Hostname-typed Gateway status address (MetalLB cannot write
# status hostnames at all, RHAI-48803); the maas-ui SNI race it aimed to
# fix is handled operationally instead: restart maas-ui after the
# gateway-hostname policy patches the listener (fresh-install runbook).
#
# To re-enable Route mode once RHAI-21506 is fixed upstream: uncomment the
# block below (mind the chart's hostname fail-fast), and drop the
# per-listener hostname patching conflicts with the gateway-hostname policy
# (it skips itself in Route mode).
#
# components:
#   aigateway:
#     modelsAsAService:
#       gateway:
#         openshiftRoute:
#           enabled: true
#           host: maas.apps.cpu-0.aigrid.bos2.lab
#         # https only: the chart's openshiftRoute mode sets TLS on every
#         # listener, and the Gateway API rejects tls on an HTTP-protocol
#         # listener, so the default http listener cannot stay. The Route
#         # redirects http to https (insecureEdgeTerminationPolicy:
#         # Redirect), so nothing is lost. Replaces the profile's
#         # http+https pair (Helm replaces lists wholesale).
#         spec:
#           listeners:
#             - name: https
#               port: 443
#               protocol: HTTPS
#               allowedRoutes:
#                 namespaces:
#                   from: Selector
#                   selector:
#                     matchExpressions:
#                       - key: kubernetes.io/metadata.name
#                         operator: In
#                         values:
#                           - openshift-ingress
#                           - models-as-a-service
#                           - redhat-ai-gateway-infra
