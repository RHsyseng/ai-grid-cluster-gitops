# Per-cluster overrides for cpu-0 (ai-grid/role=ingress). The rhoai
# ApplicationSet merges this after apps/rhoai/values.yaml and the role
# profile; absent for other clusters (ignoreMissingValueFiles).
#
# Currently exposes cpu-0's MaaS Gateway through an OpenShift Route
# (openshiftRoute mode), re-enabled on 2026-11-18 to re-test RHAI-21506
# against the current build (chart 3.6.0-dev.36.1): the reencrypt Route
# serves maas.<apps domain> through the router, so the *.apps wildcard
# resolves it and no MetalLB address, DNS record or dnsmasq entry is
# involved. The rhoai-maas-gateway-hostname policy skips itself in Route
# mode by design.
#
# History, in case LB mode returns: the spec.addresses Hostname declaration
# (945ee0d) was removed -- istiod copies it into the LoadBalancer Service's
# spec.loadBalancerIP and MetalLB allocates for that field only when it is
# an IP, so a fresh install wedges with "AllocationFailed: invalid
# spec.loadBalancerIP" (RHAI-48803). The .93 IPAddress pin that replaced it
# kept the DNS record and dnsmasq entry stable across rebuilds; both are
# unnecessary in Route mode. The maas-ui SNI race of LB mode is handled
# operationally there: restart maas-ui after the gateway-hostname policy
# patches the listener (fresh-install runbook).
#
# Fork divergence (LB-mode history, 2026-11-16/17): the Gateway's address
# was pinned to 192.168.19.93 via spec.addresses (IPAddress) so the lab DNS
# record and node dnsmasq entry stayed valid across rebuilds. That pin is
# removed for Route mode: the reencrypt Route exposes the Gateway through
# the OpenShift router, the *.apps wildcard resolves maas.<domain> to it,
# and no MetalLB address, DNS record or dnsmasq entry is involved. See
# RHAI-48803 for the LB-mode exposure story the pin belonged to.
#
# Route-mode rules the chart enforces (dev.36.1+): openshiftRoute.host is
# required; spec.listeners[].hostname is forbidden (hard render failure --
# the Route's host is the external name; in dev.34.1 it "only" caused the
# runtime filter_chain_not_found 503 behind the reencrypt Route); and every
# listener needs allowedRoutes.namespaces.from. The chart adds TLS
# Terminate with the serving-cert secret on HTTPS listeners itself.
#
# RHAI-21506 (Review) tracks the runtime defects that made Route mode
# unusable before: /v1/tenants reads the listener hostname the mode cannot
# carry, so the portal's maas-ui URL discovery breaks. This deployment
# re-tests Route mode against the current build; expect to gather evidence
# there, not a working portal, unless it has since been fixed.
#
# https only: the chart's openshiftRoute mode sets TLS on every listener,
# and the Gateway API rejects tls on an HTTP-protocol listener, so the
# default http listener cannot stay. The Route redirects http to https
# (insecureEdgeTerminationPolicy: Redirect), so nothing is lost. Replaces
# the profile's http+https pair (Helm replaces lists wholesale).
components:
  aigateway:
    modelsAsAService:
      gateway:
        openshiftRoute:
          enabled: true
          host: maas.apps.cpu-0.aigrid.bos2.lab
        spec:
          listeners:
            - name: https
              port: 443
              protocol: HTTPS
              allowedRoutes:
                namespaces:
                  from: Selector
                  selector:
                    matchExpressions:
                      - key: kubernetes.io/metadata.name
                        operator: In
                        values:
                          - openshift-ingress
                          - models-as-a-service
                          - redhat-ai-gateway-infra
