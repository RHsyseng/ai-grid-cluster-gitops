apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# This deployment keeps a pre-existing, ZTP-installed RHACM: the operator,
# MultiClusterHub and governance add-ons (core/) are owned by the ZTP flow,
# not this repo. Including core/ here created a second ACM OperatorGroup and
# Subscription in open-cluster-management, leaving the CSV in
# TooManyOperatorGroups and stalling the whole Submariner chain. Search is
# likewise ZTP-owned. MultiClusterObservability, however, is synced from
# here: upstream's observability/ manifests carry the multicluster
# observability add-on (capabilities incl. the Perses ui), the OBC and the
# thanos bridge, and the ZTP flow only installs the operator prerequisites
# (COO, via 09_coo_subscription.yaml) rather than the MCO itself. Only
# core/ and search/ stay ZTP-owned. Deliberate fork divergence until
# upstream supports BYO RHACM (issue #183).
resources:
  - observability
  - submariner
