apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# This deployment keeps a pre-existing, ZTP-installed RHACM: the operator,
# MultiClusterHub and governance add-ons (core/) and MultiClusterObservability
# (observability/) are owned by the ZTP flow, not this repo. Including core/
# here created a second ACM OperatorGroup and Subscription in
# open-cluster-management, leaving the CSV in TooManyOperatorGroups and
# stalling the whole Submariner chain; observability/ would collide with the
# ZTP-owned MultiClusterObservability. Only Submariner is managed here.
# Deliberate fork divergence until upstream supports BYO RHACM (issue #183).
resources:
  - submariner
