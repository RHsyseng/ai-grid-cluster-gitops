apiVersion: loki.grafana.com/v1
kind: LokiStack
metadata:
  name: usage-logs
  namespace: redhat-ods-monitoring
  annotations:
    # After job-provision-loki-key (wave 1) creates its object storage Secret.
    argocd.argoproj.io/sync-wave: "2"
spec:
  size: 1x.demo
  limits:
    global:
      otlp:
        streamLabels:
          resourceAttributes:
          - name: service.name
          - name: subscription
          - name: organization_id
          - name: user_id
          - name: model
          - name: response_type
          - name: kubernetes_namespace_name
          - name: cluster_name
          - name: cluster_id
      retention:
        days: 30
  storage:
    schemas:
      - version: v13
        effectiveDate: "2026-10-01"
    secret:
      name: usage-logs-object-storage
      type: s3
    tls:
      caName: openshift-service-ca-bundle
      caKey: service-ca.crt
  # Fork divergence (BYO ODF): the dedicated hub has no gp3-csi (an AWS class);
  # its ZTP-installed ODF provides ocs-storagecluster-ceph-rbd as the default.
  # Upstream hardcodes gp3-csi, which leaves the Loki PVCs Pending here
  # (RHAI-20050; upstream PR #171 makes this an input).
  storageClassName: ocs-storagecluster-ceph-rbd
  tenants:
    mode: openshift-logging
  managementState: Managed
