# The Perses instance the dashboards and datasources in this Application
# attach to (dedicated-hub gap: on a hub that runs RHOAI, the platform's
# Monitoring CR provides one; a dedicated hub runs no RHOAI, so nothing
# else creates it — the same gap 00-loki-operator.yaml in
# apps/ai-grid-usage-logs covers for the Loki operator).
#
# Prerequisite: the Cluster Observability Operator (its perses-operator
# reconciles this CR). On this fleet ZTP installs COO before the GitOps
# bootstrap (rebuild.sh observability step, 09_coo_subscription.yaml in the
# ZTP repo), so the perses.dev CRDs exist by the time this Application
# syncs.
#
# The image is pinned to the productized perses-rhel9 build (the same digest
# RHOAI's Monitoring CR uses on the sites) because the perses-operator's
# default is the community docker.io/persesdev/perses image, which lacks the
# Red Hat Loki plugins the usage-logs dashboard uses (LokiLabelValuesVariable
# — the server rejects the dashboard with "schema not found for plugin").
# It is also the only image reachable on a disconnected hub.
#
# Storage is emptyDir, matching the sites' data-science-perses: the
# dashboards and datasources live in PersesDashboard/PersesDatasource CRs
# and the perses-operator re-pushes them to the server API on reconcile, so
# the server's file database is reconstructable and needs no PV.
apiVersion: perses.dev/v1alpha2
kind: Perses
metadata:
  name: ai-grid
  namespace: redhat-ods-monitoring
spec:
  replicas: 1
  image: registry.redhat.io/cluster-observability-operator/perses-rhel9@sha256:f2cffebadddf00f16e89a471e37e25dcf5cd060918de9c2074640b646607ee76
  # Mirrors the config RHOAI's Monitoring CR renders on the sites
  # (data-science-perses). Required: without a valid config the
  # perses-operator renders an empty one and never creates the workload.
  config:
    dashboard: {}
    database:
      file:
        case_sensitive: false
        extension: yaml
        folder: /perses
    datasource:
      disable_local: false
      global:
        disable: false
      project:
        disable: false
    ephemeral_dashboard:
      cleanup_interval: 1s
      enable: true
    frontend:
      disable: false
      explorer:
        enable: false
    plugin:
      enable_dev: false
    provisioning: {}
  storage:
    emptyDir: {}
